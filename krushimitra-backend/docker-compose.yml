services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: krushi
      POSTGRES_PASSWORD: krushi
      POSTGRES_DB: krushimitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krushi -d krushimitra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://krushi:krushi@db:5432/krushimitra
      USE_MOCKS: "true"
      JWT_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
